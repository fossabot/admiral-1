server:
  listener:
    address: 0.0.0.0
    port: 8080
  timeouts:
    default: 60s
  logger:
    level: debug
  access_log:
    status_code_filters:
      - 2  # Unknown
      - 4  # DeadlineExceeded
      - 12 # Unimplemented
      - 14 # Unavailable
  enable_pprof: true
  stats:
    flush_interval: 1s
    go_runtime_stats:
      collection_interval: 5s
    reporter_type: prometheus
handlers:
  manifest:
    bucket_name: ${MANIFEST_BUCKET_NAME}
  revision:
    bucket_name: ${REVISION_BUCKET_NAME}
services:
  postgres:
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database_name: ${POSTGRES_DATABASE_NAME}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    ssl_mode: ${POSTGRES_SSL_MODE}
  storage:
    type: s3
    s3:
      endpoint: ${STORAGE_ENDPOINT}
      region: ${STORAGE_REGION}
      use_ssl: ${STORAGE_USE_SSL}
      access_key: ${STORAGE_ACCESS_KEY}
      secret_key: ${STORAGE_SECRET_KEY}
#    gcs:
#      credentials_json: ${GCS_CREDENTIALS_JSON}
#      bucket: ${GCS_BUCKET}
#      project_id: ${GCS_PROJECT_ID}
  authn:
    name: ${OAUTH2_NAME}
    issuer: ${OAUTH2_ISSUER}
    client_id: ${OAUTH2_CLIENT_ID}
    client_secret: ${OAUTH2_CLIENT_SECRET}
    redirect_url: ${OAUTH2_REDIRECT_URL}
    nonce_secret: ${OAUTH2_NONCE_SECRET}
    scopes: []
#    claim_mapping:
#      preferred_username: other_user_name
#      email: mail
#      groups: "cognito:groups"

