name: "Manual Release"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type"
        required: true
        type: choice
        options:
          - next
          - major
          - minor
          - patch
        default: next

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  calculate-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calculate.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@latest

      - name: Calculate next version
        id: calculate
        run: |
          case "${{ inputs.version_type }}" in
            next)
              VERSION=$(svu next)
              ;;
            patch)
              VERSION=$(svu patch)
              ;;
            minor)
              VERSION=$(svu minor)
              ;;
            major)
              VERSION=$(svu major)
              ;;
          esac

          echo "🔢 Calculated next ${{ inputs.version_type }} version: $VERSION"

          # Check if tag already exists
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag $VERSION already exists. Delete the tag first if you want to re-release."
            exit 1
          fi

          echo "✅ Version $VERSION ready for release"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "🏷️ Creating tag ${{ steps.calculate.outputs.version }}"
          git tag ${{ steps.calculate.outputs.version }}
          git push origin ${{ steps.calculate.outputs.version }}
          echo "✅ Tag created and pushed successfully"

  final:
    needs: calculate-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Generate summary
        run: |
          echo "🎉 **Manual release ${{ needs.calculate-and-tag.outputs.version }} initiated!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.calculate-and-tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag Created: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Calculated by: svu (semantic version utility)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- ⏳ The automatic release workflow will now trigger" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [Monitor Release Progress](https://github.com/${{ github.repository }}/actions/workflows/release.yaml)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 [View Releases](https://github.com/${{ github.repository }}/releases) (once complete)" >> $GITHUB_STEP_SUMMARY
