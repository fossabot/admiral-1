name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.3)"
        required: true
        type: string
      version_type:
        description: "Version type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      skip_tag:
        description: "Skip tag creation (if tag already exists)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi

          # Check if tag already exists
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            if [[ "${{ inputs.skip_tag }}" == "false" ]]; then
              echo "❌ Tag $VERSION already exists. Use 'skip_tag: true' if you want to re-release."
              exit 1
            else
              echo "⚠️ Tag $VERSION already exists, skipping tag creation as requested."
            fi
          fi

          echo "✅ Version $VERSION is valid"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        if: ${{ !inputs.skip_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "🏷️ Creating tag ${{ steps.validate.outputs.version }}"
          git tag ${{ steps.validate.outputs.version }}
          git push origin ${{ steps.validate.outputs.version }}
          echo "✅ Tag created and pushed successfully"

  summary:
    needs: validate-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Release Summary
        run: |
          echo "🎉 **Manual release ${{ needs.validate-and-tag.outputs.version }} initiated!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.validate-and-tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag Created: ${{ !inputs.skip_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- ⏳ The automatic release workflow will now trigger" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [Monitor Release Progress](https://github.com/${{ github.repository }}/actions/workflows/release.yaml)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 [View Releases](https://github.com/${{ github.repository }}/releases) (once complete)" >> $GITHUB_STEP_SUMMARY
