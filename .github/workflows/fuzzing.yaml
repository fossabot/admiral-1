name: "Fuzzing"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Fuzzing duration (e.g., 60s, 5m, 1h)"
        required: false
        default: "60s"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - ./internal/querybuilder

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Get fuzzing duration
        id: fuzz-duration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "duration=${{ github.event.inputs.fuzz_time }}" >> $GITHUB_OUTPUT
          else
            echo "duration=60s" >> $GITHUB_OUTPUT
          fi

      - name: Run Fuzz Tests
        run: |
          echo "Running fuzzing on ${{ matrix.package }} for ${{ steps.fuzz-duration.outputs.duration }}"

          # Run each fuzz test function individually since -fuzz only works on one package
          cd ${{ matrix.package }}

          # Find all fuzz functions in the package
          FUZZ_FUNCTIONS=$(go test -list=Fuzz. | grep "^Fuzz" || true)

          if [ -z "$FUZZ_FUNCTIONS" ]; then
            echo "No fuzz functions found in ${{ matrix.package }}"
            exit 0
          fi

          for func in $FUZZ_FUNCTIONS; do
            echo "Running $func for ${{ steps.fuzz-duration.outputs.duration }}"
            go test -fuzz="$func" -fuzztime="${{ steps.fuzz-duration.outputs.duration }}" .
          done

      - name: Upload fuzz results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-results-${{ matrix.package }}-${{ github.run_id }}
          path: |
            **/testdata/fuzz/
          retention-days: 30
