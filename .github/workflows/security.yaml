name: Security Scanning

on:
  push:
    branches:
      - "master"
      - "release-[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "master"
      - "release-[0-9]+.[0-9]+"
  schedule:
    - cron: "0 2 * * 1" # Weekly on Monday at 2 AM

permissions: {} # No permissions at workflow level

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
      security-events: write # Required to upload SARIF results
      actions: read # Required for private repos
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install dependencies
        run: make bun-install

      - name: Run Trivy vulnerability scanner for Go modules
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-go-results.sarif"
          scanners: "vuln"

      - name: Run Trivy vulnerability scanner for npm dependencies
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          scan-type: "fs"
          scan-ref: "web"
          format: "sarif"
          output: "trivy-npm-results.sarif"
          scanners: "vuln"

      - name: Upload Go dependency scan results
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        if: always()
        with:
          sarif_file: "trivy-go-results.sarif"
          category: "go-dependencies"

      - name: Upload npm dependency scan results
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        if: always()
        with:
          sarif_file: "trivy-npm-results.sarif"
          category: "npm-dependencies"

  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout code
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install dependencies
        run: make bun-install

      - name: Run license scan
        uses: fossa-contrib/fossa-action@3d2ef181b1820d6dcd1972f86a767d18167fa19b # v3.0.1
        with:
          fossa-api-key: ${{ secrets.FOSSA_API_KEY }}
        continue-on-error: true
