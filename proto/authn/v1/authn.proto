syntax = "proto3";

package admiral.authn.v1;

option go_package = "go.admiral.io/admiral/api/authn/v1;authnv1";

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "buf/validate/validate.proto";

service AuthnAPI {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      get : "/auth/login"
    };
  }

  rpc Callback(CallbackRequest) returns (CallbackResponse) {
    option (google.api.http) = {
      get : "/auth/callback"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      get : "/auth/logout"
    };
  }

  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse) {
    option (google.api.http) = {
      post : "/api/v1/authn/createToken"
      body : "*"
    };
  }
}

message LoginRequest {
  string redirect_url = 1;
}
message LoginResponse {
   message Token {
    string access_token = 1;
    string refresh_token = 2;
  }

  // If the user presents a refresh token and refresh succeeds, they will receive the token in response. Otherwise,
  // they will be redirected through the authentication flow.
  oneof return {
    string auth_url = 1;
    Token token = 2;
  }
}

message CallbackRequest {
  string code = 1;
  string state = 2;
  string error = 3;
  string error_description = 4;
}
message CallbackResponse {
}

message LogoutRequest {}
message LogoutResponse {}

message CreateTokenRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Duration expiry = 2;

  enum TokenType {
    UNSPECIFIED = 0;
    USER = 1;
    CLUSTER = 2;
  }
  TokenType token_type = 3 [ (buf.validate.field).enum = { defined_only: true, not_in: [0] } ];
}
message CreateTokenResponse {
  string access_token = 1;
}
